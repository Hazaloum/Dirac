name: registries
on:
  push:
    branches: [claude/cool-allen-cg9oit]
    paths: [tools/registries/**, .github/workflows/registries.yml]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas==2.2.3 openpyxl==3.1.5 xlrd==2.0.1 requests==2.32.3
      - run: python tools/registries/run.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tools/data/registries
          git commit -m "Registry data (built by Actions)" || echo "nothing to commit"
          git pull --rebase && git push
