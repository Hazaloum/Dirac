name: discover-cphi
on:
  push:
    branches: [claude/cool-allen-cg9oit]
    paths: [tools/discover_cphi.py, .github/workflows/discover-cphi.yml]
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python tools/discover_cphi.py
      - name: Commit the downloaded data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tools/data
          git commit -m "CPHI Milan 2026 exhibitor data (downloaded by Actions)" || echo "nothing to commit"
          git push
