name: discover-cphi
on:
  push:
    branches: [claude/cool-allen-cg9oit]
    paths: [tools/discover_cphi.py, .github/workflows/discover-cphi.yml]
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python tools/discover_cphi.py
